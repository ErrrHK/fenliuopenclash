[custom]
; ==========================================================
; 修订版（2026-09-27）
; 1. 删除全部无效的 []GEOIP,<应用名> 行（geoip 只认国家/地区代码，
;    应用名条目不存在，原写法静默失效；域名由对应 GEOSITE 行覆盖）
; 2. category-game-platforms-download（名字不存在）→ category-games
; 3. category-games@cn 为 meta-rules-dat 专属语法，Loyalsoldier dat 无此条目，
;    默认源下失效 → 并入 category-games（如换用 meta-rules-dat 可改回 @cn）
; 4. url-test 参数 300,,50 → 300,300（容差 300ms，间隔 300s）
; 5. 测速 URL 统一 https://www.gstatic.com/generate_204
; 6. 🧭 手动选择 → 🧭 全部节点（避免与 🚀 手动选择 混淆），引用同步
; ==========================================================
enable_rule_generator=true
overwrite_original_rules=true

; --- 流媒体 ---
ruleset=🇭🇰 RTHK,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/RTHK.list
ruleset=🇭🇰 mytvsuperAD,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/mytvsuperAD.list
ruleset=🇭🇰 myTVSUPER,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/myTVSUPER.list
ruleset=🇭🇰 ViuTV,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/ViuTV.list
ruleset=🇭🇰 NowTV,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/NowTV.list
ruleset=🇭🇰 HOY,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/HOY.list
ruleset=🇨🇳 TaiWan,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/TaiWan.list
ruleset=🇺🇲 USA,https://raw.githubusercontent.com/ErrrHK/Global-Streaming-Ruleset/refs/heads/main/USA.list

; ==========================================================
; 1) 规则（自上而下优先级）
; ==========================================================
ruleset=🟥 Adobe,[]GEOSITE,adobe
; --- 私网直连 ---
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; --- Aethersailor 直连补丁 ---
ruleset=DIRECT,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=DIRECT,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800

; --- Aethersailor 代理补丁（仅兜底用，不越权）---
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800

; --- 国内直连 ---
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,cn,no-resolve

; --- 国内可用 / 下载 / BT ---
ruleset=DIRECT,[]GEOSITE,google-cn
ruleset=DIRECT,[]GEOSITE,category-games
ruleset=DIRECT,[]GEOSITE,category-public-tracker

; --- 核心应用 ---
ruleset=📦 Notion,[]GEOSITE,Notion

ruleset=📨 Telegram,[]GEOSITE,telegram

ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn

ruleset=🍎 Apple,[]GEOSITE,apple
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🎥 Netflix,[]GEOSITE,netflix

; --- 海外主流应用补充 ---
ruleset=📲 facebook,[]GEOSITE,facebook
ruleset=🎵 TikTok,[]GEOSITE,tiktok
ruleset=📸 Instagram,[]GEOSITE,instagram
ruleset=🐦 X,[]GEOSITE,twitter

; --- 开发 / 工具 ---
ruleset=🧑‍💻 GitHub,[]GEOSITE,github
ruleset=🚝 测速工具,[]GEOSITE,category-speedtest
ruleset=🎮 Steam,[]GEOSITE,steam

; --- 交易所 & Adobe（全部走 GEOSITE）---
ruleset=🟦 OKX,[]GEOSITE,okx
ruleset=🟨 Binance,[]GEOSITE,binance
ruleset=🟪 Bybit,[]GEOSITE,bybit
; ==========================================================
; --- 若使用上方geo没有匹配到可以用下方url来匹配，需先在上方删除该应用的ruleset ---
; --- ruleset=🟦 OKX,clash-domain:https://xxx/okx.yaml,86400
; ==========================================================
; --- 社交 / 通讯 ---
ruleset=📞 即时通讯,[]GEOSITE,category-communication
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=↔️ teamviewer,[]GEOSITE,teamviewer

; --- Google / Microsoft（新增） ---
ruleset=☁️ cloudflare,[]GEOSITE,cloudflare

ruleset=🔎 Google,[]GEOSITE,google

ruleset=🪟 Microsoft,[]GEOSITE,microsoft

; --- GFW 兜底 ---
ruleset=🚀 手动选择,[]GEOSITE,gfw

; --- 非标端口 ---
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800

; --- 最终兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL


; ==========================================================
; 2) 应用分流策略组（UI 主入口，不越权）
; ==========================================================
custom_proxy_group=🇭🇰 myTVSUPER`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇭🇰 mytvsuperAD`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇭🇰 ViuTV`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇭🇰 NowTV`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇭🇰 RTHK`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇭🇰 HOY`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇨🇳 TaiWan`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🇺🇲 USA`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=📦 Notion`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🍎 Apple`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🤖 ChatGPT`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🧠 AI`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📲 facebook`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📨 Telegram`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📞 即时通讯`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=💬 社交媒体`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=↔️ teamviewer`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🎬 YouTube`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🎥 Netflix`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🎵 TikTok`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=📸 Instagram`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🐦 X`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🧑‍💻 GitHub`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🚝 测速工具`select`[]DIRECT`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🎮 Steam`select`[]DIRECT`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*

custom_proxy_group=🟦 OKX`select`[]DIRECT`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=🟨 Binance`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*
custom_proxy_group=🟪 Bybit`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]🌐 Default`.*

; Adobe：允许一键禁止联网
custom_proxy_group=🟥 Adobe`select`[]🧭 节点选择`[]♻️ 自动选择`[]DIRECT`[]REJECT`[]🌐 Default`.*
custom_proxy_group=🔎 Google`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
custom_proxy_group=☁️ cloudflare`select`[]🧭 节点选择`[]♻️ 自动选择`[]🌐 Default`.*
; Microsoft：允许直连优先，同时也能选五区/冷门/Default
custom_proxy_group=🪟 Microsoft`select`[]DIRECT`[]♻️ 自动选择`[]🧭 节点选择`[]🌐 Default`.*


; ==========================================================
; 3) Default / 漏网之鱼（唯一允许全节点）
;    同时新增：🧊 冷门节点（只收非 HK/JP/TW/US/SG 的节点）
; ==========================================================

; 兜底“手动选择”（不越权应用，只用于 Default/漏网）
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`[]🧭 节点选择`[]DIRECT`.*

; Default 出口（同样允许冷门节点参与）
custom_proxy_group=🌐 Default`select`[]♻️ 自动选择`[]🧭 节点选择`[]DIRECT`.*

custom_proxy_group=🐟 漏网之鱼`select`[]🌐 Default`[]DIRECT`[]♻️ 自动选择`[]🚀 手动选择`.*


; ==========================================================
; 4) 非标端口
; ==========================================================
custom_proxy_group=🔀 非标端口`select`[]🐟 遵循规则`[]DIRECT
custom_proxy_group=🐟 遵循规则`select`[]🐟 漏网之鱼


; ==========================================================
; 5) 全节点（允许任何节点显示）
; ==========================================================
custom_proxy_group=🧭 节点选择`select`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`300,300

